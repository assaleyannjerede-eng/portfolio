<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Mon Portfolio — Assale Jered Yann</title>
  <meta name="description" content="Portfolio de Assale Jered Yann — projets, compétences et contact" />

  <link rel="icon" type="image/jpeg" href="logo.jpg" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="#">Assale Jered Yann</a>
      <button id="nav-toggle" aria-label="Ouvrir le menu">☰</button>

      <nav id="main-nav" class="nav">
        <a href="#about">À propos</a>
        <a href="#projects">Projets</a>
        <a href="#skills">Compétences</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <h1 class="reveal reveal-up">
          Développeur <br />
          <span class="highlight-red">Front-end</span>
        </h1>

        <p class="role-wrap reveal reveal-up delay-1">
          <span class="role-label">Rôle</span>
          <span id="role-text" class="role-text" aria-live="polite"></span>
        </p>

        <p class="lead reveal reveal-up delay-2">
          Je crée des applications web modernes. Ici se trouvent mes projets,
          mon CV et comment me contacter.
        </p>

        <p class="reveal reveal-up delay-3">
          <a class="btn" href="#projects">Voir mes projets</a>
          <a class="btn btn-outline" href="#contact">Contactez-moi</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <center>
        <p>
          © <span id="year"></span> Assale jered yann
          <a href="#">Mentions légales</a>
        </p>
      </center>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
